[package]
name = "win-ticket-printer-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "win_ticket_printer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.3.0" # Para manejar la conexión serie (Bluetooth / COM)
chrono = "0.4"
# Dependencia exclusiva que se activará solo cuando compiles el ejecutable para Windows (.exe)
[target.'cfg(target_os = "windows")'.dependencies]
winprint = "0.1.0"

