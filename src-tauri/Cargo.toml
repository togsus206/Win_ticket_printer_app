[package]
name = "win-ticket-printer-app"
version = "0.1.0"
description = "Ticket Printer App para Estado Play"
authors = ["Matías"]
edition = "2021"

[lib]
name = "win_ticket_printer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi"] }
